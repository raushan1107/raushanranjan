name: Deploy static site to Azure Web App - raushan-ranjan

# The site is plain HTML/CSS/JS served by the Windows web app: no build step. Only site files are packaged.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir site
          cp index.html site.css favicon.ico raushan.jpg preview.png robots.txt sitemap.xml llms.txt site/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: raushan-ranjan
          slot-name: Production
          package: site
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2D9389FCEEA14DE6B0F8320D23961802 }}
